name = "my-aidemandforecasting"
main = "worker/index.js"
compatibility_date = "2026-05-11"
account_id = "615b05ce6668dd8e0e2431077fc29c82"
workers_dev = true
routes = [
  { pattern = "aidemandforecasting.space/*", zone_name = "aidemandforecasting.space" },
  { pattern = "www.aidemandforecasting.space/*", zone_name = "aidemandforecasting.space" }
]

[vars]
APP_ORIGIN = "https://aidemandforecasting.space"
CREEM_API_BASE = "https://api.creem.io"
CREEM_ENV = "live"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/sitemap.xml",
  "/robots.txt",
  "/BingSiteAuth.xml"
]

[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "00000000000000000000000000000000"
